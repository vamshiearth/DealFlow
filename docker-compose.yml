services:
  postgres:
    image: postgres:16-alpine
    container_name: dealflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealflow
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dealflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
