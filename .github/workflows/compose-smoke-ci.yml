name: Compose Smoke CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: compose-smoke-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Full Stack Compose Smoke Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          echo "DEALFLOW_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DEALFLOW_JWT_SECRET=$(openssl rand -hex 64)" >> "$GITHUB_ENV"

      - name: Create external PostgreSQL volume
        run: docker volume create dealflow-postgres-data

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build Compose services
        run: docker compose build

      - name: Start Compose stack
        run: docker compose up -d

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres \
              pg_isready -U dealflow -d dealflow; then
              echo "PostgreSQL is ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Wait for backend through Nginx
        shell: bash
        run: |
          for i in {1..60}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8082/api/health; then
              echo
              echo "DealFlow is ready through Nginx"
              exit 0
            fi

            echo "Waiting for DealFlow..."
            sleep 2
          done

          echo "DealFlow did not become ready"
          exit 1

      - name: Verify frontend
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8082/ \
            > /dev/null

      - name: Verify Nginx API proxy
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8082/api/health

      - name: Verify direct backend health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8081/api/health

      - name: Verify SPA fallback
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8082/deals/37 \
            > /dev/null

      - name: Show Compose status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down

      - name: Remove CI PostgreSQL volume
        if: always()
        run: docker volume rm dealflow-postgres-data || true
