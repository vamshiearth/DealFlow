spring.application.name=backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/dealflow}
spring.datasource.username=${DATABASE_USERNAME:user}
spring.datasource.password=${DATABASE_PASSWORD:user}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cpq.enabled=${CPQ_ENABLED:false}
cpq.base-url=${CPQ_BASE_URL:}
cpq.username=${CPQ_USERNAME:}
cpq.password=${CPQ_PASSWORD:}